; MinerU CPU 版常驻服务守护配置（pipeline 后端，不依赖 vllm/GPU）
; 用法：supervisord -c /root/autodl-tmp/semantic_toolkit_final/config/supervisor/supervisord.conf
;   （与 GPU 版 mineru-api.conf 二选一，不要同时启用两个 mineru-api program）
;
; 依赖：conda 环境 mineru_cpu（pip install "mineru[core,pipeline]"，不装 vllm extra）
;   onnxruntime 走 CPU，无需 CUDA/nvcc。

[program:mineru-api]
command=bash /root/autodl-tmp/semantic_toolkit_final/scripts/mineru_api_cpu.sh --foreground
directory=/root/autodl-tmp/semantic_toolkit_final
; 注意 PATH 不含 /usr/local/cuda/bin（无 CUDA）；mineru_cpu 环境无 vllm/ninja 依赖
; OMP_NUM_THREADS 限 onnxruntime/torch CPU 线程，留核给后端+GLM。8核设4，16核设6-8。
environment=PATH="/root/autodl-tmp/conda/envs/mineru_cpu/bin:%(ENV_PATH)s",HOME="/root",MINERU_API_MAX_CONCURRENT_REQUESTS="3",OMP_NUM_THREADS="4"
autostart=true
autorestart=true
startsecs=180          ; CPU pipeline + onnxruntime 模型加载比 GPU vllm 慢，给 180s 宽限
startretries=3
stopsignal=TERM
stopwaitsecs=60        ; CPU 推理慢，优雅停止多给点时间
stdout_logfile=/var/log/mineru-api.out.log
stderr_logfile=/var/log/mineru-api.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
