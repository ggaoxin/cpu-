; 独立 supervisord（专管 mineru-api，与 autodl 系统 supervisord 隔离）
; 用独立 socket/pidfile 避免与 /init/supervisor/supervisor.ini 的系统 supervisord 冲突。
; 启动：supervisord -c /root/autodl-tmp/semantic_toolkit_final/config/supervisor/supervisord.conf
; 状态：supervisorctl -c 本文件 status
; 重启 mineru-api：supervisorctl -c 本文件 restart mineru-api

[unix_http_server]
file=/tmp/mineru-supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/mineru-supervisord.log
pidfile=/tmp/mineru-supervisord.pid
childlogdir=/var/log
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/mineru-supervisor.sock

[include]
files = /root/autodl-tmp/semantic_toolkit_final/config/supervisor/*.conf
