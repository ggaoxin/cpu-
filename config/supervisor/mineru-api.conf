; MinerU vLLM 常驻服务守护配置
; 用法：supervisord -c /root/autodl-tmp/semantic_toolkit_final/config/supervisor/supervisord.conf
; 或把本文件放到已有 supervisor 的 include 目录（通常 /etc/supervisor/conf.d/）
;
; 依赖：conda 环境 mineru_vllm（vllm 0.21.0 + mineru 3.4.5 + torch 2.11+cu130）
; flashinfer JIT 需要 ninja（conda bin）+ nvcc（/usr/local/cuda/bin），故 PATH 必须含两者。

[program:mineru-api]
command=bash /root/autodl-tmp/semantic_toolkit_final/scripts/mineru_api_guarded.sh
directory=/root/autodl-tmp/semantic_toolkit_final
environment=PATH="/root/autodl-tmp/conda/envs/mineru_vllm/bin:/usr/local/cuda/bin:%(ENV_PATH)s",CUDA_HOME="/usr/local/cuda",HOME="/root",MINERU_API_MAX_CONCURRENT_REQUESTS="8"
autostart=true
autorestart=true
startsecs=120
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/mineru-api.out.log
stderr_logfile=/var/log/mineru-api.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
