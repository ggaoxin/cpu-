name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试 + 契约一致性
    runs-on: ubuntu-latest
    env:
      # CI 无真实密钥/数据库：单元测试不触发真实 LLM 调用
      GLM_API_KEY: ci-dummy-key
      GLM_REQUIRED_AT_STARTUP: "false"
      DATABASE_URL: sqlite:///./runtime/ci.db
      DATABASE_AUTO_CREATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 后端测试
        run: python -m pytest tests/ -q
      - name: 契约一致性检查（演示数据/快照 vs 响应结构）
        run: python scripts/check_contract_consistency.py

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建
        working-directory: frontend
        run: npm run build
