functional_item: 语步识别工具
name: 中文摘要语步识别
description: 从中文科技文献摘要中将其划分为研究背景/研究目的/研究方法/研究结果/研究结论五个语步段。
input_type: text
system_prompt: '你是中文科技文献摘要语步识别专家。请将输入的中文论文摘要划分为五个语步段，

  每段必须是原文的逐字摘录，不得改写、不得遗漏、不得新增，五段拼接后应能还原原摘要。

  五个语步类别：

  - 研究背景：交代问题来源、现实需求、已有研究不足等铺垫性内容；

  - 研究目的：阐明本文要解决什么问题、达成什么目标；

  - 研究方法：描述采用的数据、模型、方法、实验手段、框架构建；

  - 研究结果：陈述客观发现、数据结果、实验结论性事实；

  - 研究结论：对结果的升华判断、对策建议、理论/实践意义。

  若摘要不含某语步，该语步输出空字符串。'
principles: '判定时以"语言机制"而非"个别词汇"为依据，关注以下维度：

  1. 研究主体：区分"本文/本研究/所提模型"与"已有研究/相关文献/其他学者"。含"已有研究表明"的句子通常属背景，即使出现"表明"也不判为本文结果。

  2. 事实状态：区分"已完成"（结果表明、实验发现、提高了、获得了）与"计划/目的"（拟采用、旨在、计划、有望、预期）及"能力描述"（能够提高、可以增强、用于改善）。"能够提高"未必是结果，可能只是方法功能描述。

  3. 方法功能 vs 真实结果：仅描述方法能够产生的效果或预期效果时，不判为本文结果；需有实验、数据、与基线比较或统计显著性等完成性事实支撑，才判为研究结果。

  4. 结果与结论边界：结果是客观发现的事实陈述；结论是对结果的升华判断、对策建议或意义展望。结论通常排在结果之后；若"提出对策/建议"出现在结果之前，归研究目的而非结论。

  5. 目的与方法边界：当"针对…问题"与"本文提出…方法/模型/框架"同时出现时，应识别复合句的语步边界——"针对…问题"为目的性从句，"本文提出…"为方法主句；不要因含"针对"就把整句判为目的。

  6. 篇章顺序：通常遵循"背景→目的→方法→结果→结论"；位置仅作辅助证据，不能单独决定标签。

  7. 输出须为原文逐字摘录，五段拼接还原原摘要。'
dictionaries:
  研究背景:
  - 近年来
  - 随着
  - 目前
  - 现有方法
  - 然而
  - 仍存在
  - 已有研究
  - 相关文献
  研究目的:
  - 旨在
  - 为了
  - 针对
  - 目的是
  - 致力于
  - 以期
  研究方法:
  - 提出
  - 构建
  - 设计
  - 采用
  - 引入
  - 利用
  - 构建
  - 建立
  研究结果:
  - 实验结果表明
  - 结果显示
  - 结果表明
  - 优于
  - 提高了
  - 降低了
  - 发现
  研究结论:
  - 说明
  - 证明
  - 具有重要意义
  - 具有应用价值
  - 可为
  - 据此
  - 综上
  - 建议
pattern_rules:
- id: MR-ZH-001
  layer: universal
  scope: global
  target_move: 研究结果
  action: +score
  level: soft
  weight: 0.5
  description: 判"研究结果"需结果谓词 + 实验数据/数值证据，排除已有研究与预测性表达
  necessary_conditions:
  - kind: keyword
    any_of:
    - 结果表明
    - 结果显示
    - 实验结果
    - 发现
    - 提高
    - 降低
    - 优于
    - 呈现
  - kind: regex
    pattern: \\d+(\\.\\d+)?\\s*[%％]|提高了|降低了|优于|显著
  exclusion_conditions:
  - kind: keyword
    any_of:
    - 已有研究
    - 相关文献
    - 其他学者
    - 先前研究
    - 以往研究
  - kind: keyword
    any_of:
    - 有望
    - 预期
    - 预计
    - 能够提高
    - 可以增强
- id: MR-ZH-002
  layer: universal
  scope: global
  target_move: 研究背景
  action: +score
  level: soft
  weight: 0.5
  description: 含第三方研究主体（已有研究/相关文献）的发现句属背景，不属本文结果
  necessary_conditions:
  - kind: keyword
    any_of:
    - 已有研究
    - 相关文献
    - 其他学者
    - 先前研究
    - 前人
    - 以往研究
  - kind: position
    rel_min: 0.0
    rel_max: 0.4
- id: MR-ZH-003
  layer: universal
  scope: global
  target_move: 研究结论
  action: +score
  level: soft
  weight: 0.5
  description: 结论须排在结果之后，含对策/建议/意义升华表达
  necessary_conditions:
  - kind: position
    after_move: 研究结果
  - kind: keyword
    any_of:
    - 据此
    - 综上
    - 建议
    - 应当
    - 需要
    - 具有重要意义
    - 具有应用价值
    - 可为
  exclusion_conditions:
  - kind: keyword
    any_of:
    - 提出方法
    - 提出模型
    - 提出框架
- id: MR-ZH-004
  layer: universal
  scope: global
  target_move: 研究方法
  action: +score
  level: soft
  weight: 0.5
  description: '"本文提出/构建/设计…方法/模型/框架"为方法主句，整句判方法'
  necessary_conditions:
  - kind: keyword
    any_of:
    - 本文提出
    - 提出一种
    - 构建了
    - 设计了
    - 建立了
    - 采用
    - 引入
  - kind: regex
    pattern: (方法|模型|框架|算法|体系|网络)
  exclusion_conditions:
  - kind: keyword
    any_of:
    - 已有研究
    - 相关文献
- id: MR-ZH-005
  layer: universal
  scope: global
  target_move: 研究结果
  action: -score
  level: soft
  weight: 0.5
  description: 仅方法功能描述（能够/可以+效果）且无实验数据证据时，削弱"结果"判定
  necessary_conditions:
  - kind: keyword
    any_of:
    - 能够提高
    - 可以增强
    - 用于改善
    - 能够有效
    - 可满足
  - kind: regex
    pattern: (有利于|有助于|能够|可以)
  exclusion_conditions:
  - kind: regex
    pattern: \\d+(\\.\\d+)?\\s*[%％]|提高了|降低了|优于
- id: MR-ZH-103
  layer: universal
  scope: global
  target_move: 研究目的
  action: +score
  level: advisory
  weight: 0.5
  description: 见到'文章/本文'+研究范围动词'分析了/讨论了/探讨了'+在方法语步出现之前→判为研究目的，理由：此结构是论文开篇对研究范围和目标的总体陈述，'分析了/讨论了'此处表示将要分析的研究内容而非具体方法操作
  necessary_conditions:
  - kind: keyword
    any_of:
    - 文章
    - 本文
    - 本研究
    - 本论文
  - kind: keyword
    any_of:
    - 分析了
    - 讨论了
    - 探讨了
    - 研究了
    - 阐述了
    - 考察了
  - kind: position
    before_move: 研究方法
  exclusion_conditions:
  - kind: keyword
    any_of:
    - 采用
    - 步骤
    - 算法
    - 流程
    - 框架
    - 代码
    - 伪代码
  - kind: keyword
    any_of:
    - 实验结果
    - 仿真结果
    - 测试结果
  stats:
    matched: 2
    correct: 1
    incorrect: 0
    estimated_reliability: 0.5
    evidence_strength: low
    net_gain: 1
    measured_on: 验证集(未参与归纳)
output_schema:
  type: object
  properties:
    研究背景:
      type: string
    研究目的:
      type: string
    研究方法:
      type: string
    研究结果:
      type: string
    研究结论:
      type: string
  required:
  - 研究背景
  - 研究目的
  - 研究方法
  - 研究结果
  - 研究结论
examples: []
