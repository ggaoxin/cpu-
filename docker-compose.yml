services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: semantic_toolkit
      MYSQL_USER: semantic_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-semantic_app_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 单条语句/结果包上限:任务结果 JSON、解析全文单行可达 ~150MB(utf8mb4 中文约 3B/字符),
      # 默认 64M 读写双向都会报 1153 Packet too large,256M 覆盖最大单行
      - --max_allowed_packet=256M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://semantic_app:${MYSQL_PASSWORD:-semantic_app_change_me}@mysql:3306/semantic_toolkit?charset=utf8mb4
      DATABASE_AUTO_CREATE: "true"
      DATABASE_REQUIRED: "true"
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.2}
      GLM_REQUIRED_AT_STARTUP: ${GLM_REQUIRED_AT_STARTUP:-true}
      MINERU_BIN: ${MINERU_BIN:-mineru}
      # mineru-api 常驻服务（2026-11-06 起 compose 内独立容器）：backend 经网络名
      # 访问，pipeline 后端 + CPU 并发口径同 docs/无GPU版部署文档.md .env.nogpu
      # （此前未注入 → settings 默认 127.0.0.1:8899/vlm-engine，容器内必然连不上）
      MINERU_API_URL: ${MINERU_API_URL:-http://mineru:8899}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_API_TIMEOUT: ${MINERU_API_TIMEOUT:-900}
      MINERU_MAX_CONCURRENCY: ${MINERU_MAX_CONCURRENCY:-3}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TZ: Asia/Shanghai
      # 多 Worker 并发守恒：settings.py 按 WEB_CONCURRENCY 整除 ASYNC_WORKERS/GLM_MAX_CONCURRENCY，
      # 2 worker 下每进程 2/3，全局仍约 4/6，GLM QPS 不翻倍
      WEB_CONCURRENCY: "2"
      # API Key 鉴权（默认关闭）：.env 设 API_AUTH_ENABLED=true 开启；
      # 请求头 X-API-Key 命中 API_KEYS 任一密钥即放行（/health /docs 豁免）
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
    volumes:
      - ./models:/app/models:ro
      - ./rag_store:/app/rag_store:ro
      - ./data:/app/data:ro
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # MinerU 解析服务（2026-11-06 补装，pipeline CPU 后端）：PDF 文件输入的标题
  # 结构化来源（rq-detect 章节溯源/基金语步层级/引用工具版面质量均依赖）。
  # 首次解析触发模型下载到 mineru_cache 卷（数分钟，modelscope 国内源）；
  # backend 不 depends_on 本服务——mineru 未就绪时 backend 照常启动、降级
  # pdfplumber（presentation.main 启动日志有相应提示），不互相阻塞
  mineru:
    build:
      context: .
      dockerfile: Dockerfile.mineru
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 请求级并发上限（mineru-api 自带队列，/health 会回显）；CPU pipeline 单
      # 请求吃满多核，3 并发饱和，再高抢核反慢（无GPU版部署文档 §十二）
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-3}
      # onnxruntime/torch CPU 线程：文档口径 8 核机 4 / 16 核机 6-8；本机 32 核
      # 但共享（同事多套栈在跑），3 并发 × 8 线程 ≈ 24 线程留余量
      OMP_NUM_THREADS: ${MINERU_OMP_NUM_THREADS:-8}
    volumes:
      - mineru_cache:/root/.cache
    # 共享机内存护栏：pipeline 模型 + 3 并发推理峰值远小于 16G，防失控占用
    mem_limit: ${MINERU_MEM_LIMIT:-16g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 10
      # CPU pipeline 模型加载慢（无GPU版文档 supervisor startsecs=180 同口径）
      start_period: 180s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx 经 template 渲染时注入 X-API-Key，网页控制台自身无需携带密钥
      NGINX_API_KEY: ${NGINX_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
  mineru_cache:
