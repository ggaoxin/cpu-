services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: semantic_toolkit
      MYSQL_USER: semantic_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-semantic_app_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 单条语句/结果包上限:任务结果 JSON、解析全文单行可达 ~150MB(utf8mb4 中文约 3B/字符),
      # 默认 64M 读写双向都会报 1153 Packet too large,256M 覆盖最大单行
      - --max_allowed_packet=256M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://semantic_app:${MYSQL_PASSWORD:-semantic_app_change_me}@mysql:3306/semantic_toolkit?charset=utf8mb4
      DATABASE_AUTO_CREATE: "true"
      DATABASE_REQUIRED: "true"
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.2}
      GLM_REQUIRED_AT_STARTUP: ${GLM_REQUIRED_AT_STARTUP:-true}
      MINERU_BIN: ${MINERU_BIN:-mineru}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TZ: Asia/Shanghai
      # 多 Worker 并发守恒：settings.py 按 WEB_CONCURRENCY 整除 ASYNC_WORKERS/GLM_MAX_CONCURRENCY，
      # 2 worker 下每进程 2/3，全局仍约 4/6，GLM QPS 不翻倍
      WEB_CONCURRENCY: "2"
      # API Key 鉴权（默认关闭）：.env 设 API_AUTH_ENABLED=true 开启；
      # 请求头 X-API-Key 命中 API_KEYS 任一密钥即放行（/health /docs 豁免）
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
    volumes:
      - ./models:/app/models:ro
      - ./rag_store:/app/rag_store:ro
      - ./data:/app/data:ro
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx 经 template 渲染时注入 X-API-Key，网页控制台自身无需携带密钥
      NGINX_API_KEY: ${NGINX_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
