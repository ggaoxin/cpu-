functional_item: 语步识别工具
input_type: text
name: 英文摘要语步识别
output_schema:
  properties:
    Background:
      type: string
    Conclusion:
      type: string
    Methods:
      type: string
    Objective:
      type: string
    Results:
      type: string
  required:
  - Background
  - Objective
  - Methods
  - Results
  - Conclusion
  type: object
pattern_rules:
- action: +score
  description: Label Results requires a result predicate + experimental/numeric evidence, excluding third-party and expected expressions
  exclusion_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    - has been reported
    - have been reported
    kind: keyword
  - any_of:
    - is expected
    - expected to
    - can potentially
    - can improve
    - able to
    kind: keyword
  id: MR-EN-001
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - showed
    - found
    - demonstrated
    - results show
    - our results
    - improved
    - outperformed
    - achieved
    - reveal
    kind: keyword
  - kind: regex
    pattern: \d+(\.\d+)?\s*%|improved|outperform|higher than|lower than|significant
  scope: global
  target_move: Results
  weight: 0.5
- action: +score
  description: A finding sentence with a third-party research actor belongs to Background, not this paper's Results
  exclusion_conditions: []
  id: MR-EN-002
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    - earlier studies
    - previous work
    - the literature
    kind: keyword
  - kind: position
    rel_max: 0.4
    rel_min: 0.0
  scope: global
  target_move: Background
  weight: 0.5
- action: +score
  description: Conclusion follows Results and contains interpretation/implication/suggestion expressions
  exclusion_conditions:
  - any_of:
    - we propose
    - we develop
    - we design
    kind: keyword
  id: MR-EN-003
  layer: universal
  level: soft
  necessary_conditions:
  - after_move: Results
    kind: position
  - any_of:
    - we conclude
    - in conclusion
    - conclude that
    - suggest
    - imply
    - implications
    - paves the way
    - holds promise
    kind: keyword
  scope: global
  target_move: Conclusion
  weight: 0.5
- action: +score
  description: '"We propose/introduce/present [NAME]" declaration → Objective (announcing what), method details → Methods (2026-09-09 fix, mirrors Chinese rule fix)'
  exclusion_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    kind: keyword
  - any_of:
    - to address this
    - to address these
    - to tackle
    - to this end
    - in this paper
    - in this work
    - aimed to address
    kind: keyword
  id: MR-EN-004
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - we propose
    - propose
    - we develop
    - develop
    - we design
    - design
    - employ
    - we present
    - construct
    kind: keyword
  - kind: regex
    pattern: (model|framework|algorithm|method|approach|system|network)
  scope: global
  target_move: Objective
  weight: 0.5
- action: +score
  description: Proposal declaration sentence ("To address this, we propose X" / "In this paper, we present X") states the research aim — label it Objective, not Methods
  exclusion_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    kind: keyword
  - any_of:
    - specifically
    - we first
    - in addition
    - finally
    - we then
    - we conduct
    kind: keyword
  id: MR-EN-006
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - we propose
    - we present
    - we introduce
    - we develop
    - we design
    kind: keyword
  - any_of:
    - to address this
    - to address these
    - to tackle
    - to this end
    - in this paper
    - in this work
    - we propose
    kind: keyword
  scope: global
  target_move: Objective
  weight: 0.6
- action: -score
  description: Mere method-function description (can/able to + effect) without experimental evidence weakens Results
  exclusion_conditions:
  - kind: regex
    pattern: \d+(\.\d+)?\s*%|improved|outperform|higher than|lower than
  id: MR-EN-005
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - can improve
    - able to
    - can achieve
    - capable of
    - enables
    - allows
    - facilitates
    kind: keyword
  - kind: regex
    pattern: (can|able|capable|enables|allows)
  scope: global
  target_move: Results
  weight: 0.5
- action: +score
  description: '"Results show/Experiments demonstrate" + specific data → Results (not Conclusion)'
  exclusion_conditions:
  - any_of:
    - existing benchmarks
    - prior work
    - related work
    - existing methods
    kind: keyword
  fold_count: 0
  id: MR-EN-130
  layer: universal
  level: strong
  necessary_conditions:
  - any_of:
    - results show
    - experiments show
    - experiments demonstrate
    - experimental results
    - results demonstrate
    - achieves
    - outperform
    kind: keyword
  - kind: regex
    pattern: (\d+(?:\.\d+)?\s*[%％%]|\d+\s*datasets|state-of-the-art|P\s*<|vs\.)
  scope: global
  stats: {}
  target_move: Results
  weight: 0.35
principles: 'Judge by language mechanism, not isolated vocabulary. Attend to:

  1. Research actor: distinguish "this paper/we/our" from "previous studies/existing research/prior work". A finding sentence with a third-party actor (e.g., "Previous studies have shown...") is Background,
  not this paper''s Result, even if it contains "shown".

  2. Fact status / tense: distinguish completed ("showed/demonstrated/found/improved") from planned ("will/plan to") and expected ("is expected to/can potentially"). "can improve" is likely method-function,
  not a result.

  3. Method function vs real result: a sentence merely describing what a method can do or is expected to do is NOT a result; require experimental/numeric/comparison evidence to label as Results.

  4. Results vs Conclusion boundary: Results state objective facts; Conclusion interprets them, gives implications or suggestions. Conclusion usually follows Results; if a suggestion appears before Results,
  it is Objective.

  5. Objective vs Methods boundary: "We propose/introduce/present [NAME]" as the first declaration → Objective; method details that follow → Methods. "To address this gap, we propose..." → entire sentence
  is Objective. Do NOT merge the declaration into Methods.


  6. Paradigm-description sentences (how the existing approach/paradigm works, e.g. "Based on these sequences, GR predicts the next item by ...") describe prior-art mechanics, not this paper''s method —
  label them Background, not Methods.

  7. Discourse order: typically Background→Objective→Methods→Results→Conclusion; position is only auxiliary evidence.

  8. Non-move declarations: availability statements (code/model/dataset released or available, with or without a URL),
  acknowledgements, and contact info do NOT belong to any of the five moves — never force them into Conclusion. Exclude
  them from every span.

  9. Output must be verbatim excerpts; the five spans reconstruct the abstract minus excluded non-move declarations.'
system_prompt: 'You are an expert in rhetorical move recognition for English scientific abstracts. Segment the input abstract into five move spans.

  Each span must be a verbatim excerpt of the original text (no rewriting, no omission, no addition); concatenating the five spans should reconstruct the original abstract.

  Five move categories:

  - Background: context, problem origin, real-world need, gaps in prior work;

  - Objective: what this paper aims to solve or achieve;

  - Methods: data, models, methods, experimental setup, framework construction;

  - Results: objective findings, data outcomes, experimental facts;

  - Conclusion: interpretation of results, implications, suggestions, significance.

  Classification rules (STRICTLY follow):

  - "We propose / We introduce / We present [NAME]" as a declaration sentence (announcing what this paper does) → Objective; subsequent method details (how it works, technical specifics) → Methods. Do NOT
  merge the declaration into Methods.

  - "Results show / Experiments demonstrate" with specific data (numbers, comparisons, percentages) → Results; only the final summarizing/uplifting clause → Conclusion. Do NOT classify an entire sentence
  containing data as Conclusion.

  - When one sentence contains Methods + Results + Conclusion, split at semicolon/period boundaries into respective moves. Do NOT assign the entire sentence to a single move leaving others empty.

  If the abstract contains no sentence for a move, output an empty string for that move.'
