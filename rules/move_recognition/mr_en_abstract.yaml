description: Segment an English scientific abstract into five move spans - Background/Objective/Methods/Results/Conclusion.
dictionaries:
  Background:
  - however
  - remains challenging
  - is limited
  - previous studies
  - prior work
  - existing research
  - little is known
  - gap
  Conclusion:
  - we conclude
  - in conclusion
  - suggest
  - imply
  - implications
  - paves the way
  - holds promise
  Methods:
  - propose
  - develop
  - design
  - employ
  - introduce
  - construct
  - we present
  - model
  - framework
  Objective:
  - aim to
  - goal
  - in order to
  - in this paper, we present
  - in this paper, we propose
  - in this work
  - in this work, we
  - the objective
  - this paper proposes
  - to address
  - to address this, we propose
  - to investigate
  - we design
  - we develop
  - we further propose
  - we introduce
  - we investigate
  - we present
  - we propose
  Results:
  - our results
  - results show
  - we find
  - demonstrated
  - improved
  - outperformed
  - achieved
