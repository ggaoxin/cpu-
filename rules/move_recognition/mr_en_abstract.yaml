description: Segment an English scientific abstract into five move spans - Background/Objective/Methods/Results/Conclusion.
dictionaries:
  Background:
  - however
  - remains challenging
  - is limited
  - previous studies
  - prior work
  - existing research
  - little is known
  - gap
  Conclusion:
  - we conclude
  - in conclusion
  - suggest
  - imply
  - implications
  - paves the way
  - holds promise
  Methods:
  - propose
  - develop
  - design
  - employ
  - introduce
  - construct
  - we present
  - model
  - framework
  Objective:
  - aim to
  - goal
  - in order to
  - in this paper, we present
  - in this paper, we propose
  - in this work
  - in this work, we
  - the objective
  - this paper proposes
  - to address
  - to address this, we propose
  - to investigate
  - we design
  - we develop
  - we further propose
  - we introduce
  - we investigate
  - we present
  - we propose
  Results:
  - our results
  - results show
  - we find
  - demonstrated
  - improved
  - outperformed
  - achieved
examples:
- abstract: 'Perovskite solar cells offer high conversion efficiency, making them a leading candidate for next-generation photovoltaics. To address the thermal degradation of perovskite films, we adopt an interface passivation strategy that introduces organic ligands to suppress ion migration. Test results show that device T80 lifetime extends to 1200 h under 85C aging, providing a reference for industrialization.'
  spans:
    Background: Perovskite solar cells offer high conversion efficiency, making them a leading candidate for next-generation photovoltaics.
    Objective: To address the thermal degradation of perovskite films
    Methods: we adopt an interface passivation strategy that introduces organic ligands to suppress ion migration
    Results: Test results show that device T80 lifetime extends to 1200 h under 85C aging
    Conclusion: providing a reference for industrialization.
- abstract: 'We present TranslateGemma, a suite of open machine translation models based on the Gemma 3 foundation models. To enhance the inherent multilingual capabilities of Gemma 3 for translation, we employ a two-stage fine-tuning process. First, supervised fine-tuning is performed using synthetic parallel data and human-translated parallel data. We demonstrate the effectiveness of TranslateGemma with human evaluation on the WMT25 test set across 10 language pairs. The results provide practical guidance for building multilingual translation systems.'
  spans:
    Background: ''
    Objective: We present TranslateGemma, a suite of open machine translation models based on the Gemma 3 foundation models. To enhance the inherent multilingual capabilities of Gemma 3 for translation
    Methods: we employ a two-stage fine-tuning process. First, supervised fine-tuning is performed using synthetic parallel data and human-translated parallel data.
    Results: We demonstrate the effectiveness of TranslateGemma with human evaluation on the WMT25 test set across 10 language pairs.
    Conclusion: The results provide practical guidance for building multilingual translation systems.
- abstract: 'Deep RL agents often fail to generalize beyond their training distribution. In this paper, we show that this failure stems from representation collapse in the shared encoder, and we highlight a fundamental distinction: RL policies engage in deeper yet narrower reasoning than base models. To exploit this, we propose Multi-Group Policy Optimization (MUPO) that incentivizes divergent thinking across multiple solutions, leading to improved pass@k on unseen tasks. Experiments on 12 reasoning benchmarks show that MUPO improves pass@k by 8.2% on average over GRPO. These findings suggest that diversity-aware optimization is key to reasoning generalization.'
  spans:
    Background: Deep RL agents often fail to generalize beyond their training distribution.
    Objective: 'In this paper, we show that this failure stems from representation collapse in the shared encoder, and we highlight a fundamental distinction: RL policies engage in deeper yet narrower reasoning than base models.'
    Methods: To exploit this, we propose Multi-Group Policy Optimization (MUPO) that incentivizes divergent thinking across multiple solutions
    Results: leading to improved pass@k on unseen tasks. Experiments on 12 reasoning benchmarks show that MUPO improves pass@k by 8.2% on average over GRPO.
    Conclusion: These findings suggest that diversity-aware optimization is key to reasoning generalization.
functional_item: 语步识别工具
input_type: text
name: 英文摘要语步识别
output_schema:
  properties:
    Background:
      type: string
    Conclusion:
      type: string
    Methods:
      type: string
    Objective:
      type: string
    Results:
      type: string
  required:
  - Background
  - Objective
  - Methods
  - Results
  - Conclusion
  type: object
pattern_rules:
- action: +score
  description: Label Results requires a result predicate + experimental/numeric evidence, excluding third-party and expected expressions
  exclusion_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    - has been reported
    - have been reported
    kind: keyword
  - any_of:
    - is expected
    - expected to
    - can potentially
    - can improve
    - able to
    kind: keyword
  id: MR-EN-001
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - showed
    - found
    - demonstrated
    - results show
    - our results
    - improved
    - outperformed
    - achieved
    - reveal
    kind: keyword
  - kind: regex
    pattern: \d+(\.\d+)?\s*%|improved|outperform|higher than|lower than|significant
  scope: global
  target_move: Results
  weight: 0.5
- action: +score
  description: A finding sentence with a third-party research actor belongs to Background, not this paper's Results
  exclusion_conditions: []
  id: MR-EN-002
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    - earlier studies
    - previous work
    - the literature
    kind: keyword
  - kind: position
    rel_max: 0.4
    rel_min: 0.0
  scope: global
  target_move: Background
  weight: 0.5
- action: +score
  description: Conclusion follows Results and contains interpretation/implication/suggestion expressions
  exclusion_conditions:
  - any_of:
    - we propose
    - we develop
    - we design
    kind: keyword
  id: MR-EN-003
  layer: universal
  level: soft
  necessary_conditions:
  - after_move: Results
    kind: position
  - any_of:
    - we conclude
    - in conclusion
    - conclude that
    - suggest
    - imply
    - implications
    - paves the way
    - holds promise
    kind: keyword
  scope: global
  target_move: Conclusion
  weight: 0.5
- action: +score
  description: '"We propose/introduce/present [NAME]" declaration → Objective (announcing what), method details → Methods (2026-09-09 fix, mirrors Chinese rule fix)'
  exclusion_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    kind: keyword
  - any_of:
    - to address this
    - to address these
    - to tackle
    - to this end
    - in this paper
    - in this work
    - aimed to address
    kind: keyword
  id: MR-EN-004
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - we propose
    - propose
    - we develop
    - develop
    - we design
    - design
    - employ
    - we present
    - construct
    kind: keyword
  - kind: regex
    pattern: (model|framework|algorithm|method|approach|system|network)
  scope: global
  target_move: Objective
  weight: 0.5
- action: +score
  description: Proposal declaration sentence ("To address this, we propose X" / "In this paper, we present X") states the research aim — label it Objective, not Methods
  exclusion_conditions:
  - any_of:
    - previous studies
    - prior work
    - existing research
    kind: keyword
  - any_of:
    - specifically
    - we first
    - in addition
    - finally
    - we then
    - we conduct
    kind: keyword
  id: MR-EN-006
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - we propose
    - we present
    - we introduce
    - we develop
    - we design
    kind: keyword
  - any_of:
    - to address this
    - to address these
    - to tackle
    - to this end
    - in this paper
    - in this work
    - we propose
    kind: keyword
  scope: global
  target_move: Objective
  weight: 0.6
- action: -score
  description: Mere method-function description (can/able to + effect) without experimental evidence weakens Results
  exclusion_conditions:
  - kind: regex
    pattern: \d+(\.\d+)?\s*%|improved|outperform|higher than|lower than
  id: MR-EN-005
  layer: universal
  level: soft
  necessary_conditions:
  - any_of:
    - can improve
    - able to
    - can achieve
    - capable of
    - enables
    - allows
    - facilitates
    kind: keyword
  - kind: regex
    pattern: (can|able|capable|enables|allows)
  scope: global
  target_move: Results
  weight: 0.5
- action: +score
  description: '"Results show/Experiments demonstrate" + specific data → Results (not Conclusion)'
  exclusion_conditions:
  - any_of:
    - existing benchmarks
    - prior work
    - related work
    - existing methods
    kind: keyword
  fold_count: 0
  id: MR-EN-130
  layer: universal
  level: strong
  necessary_conditions:
  - any_of:
    - results show
    - experiments show
    - experiments demonstrate
    - experimental results
    - results demonstrate
    - achieves
    - outperform
    kind: keyword
  - kind: regex
    pattern: (\d+(?:\.\d+)?\s*[%％%]|\d+\s*datasets|state-of-the-art|P\s*<|vs\.)
  scope: global
  stats: {}
  target_move: Results
  weight: 0.35
principles: 'Sub-sentence semantic fragment splitting (core principle, 2026-11-06): a long sentence often serves multiple move functions and MUST be split at semantic boundaries — at commas, semicolons, or periods. Incomplete sentences are allowed, but each fragment must have a clear, independent move function. Example: "To address thermal degradation, we adopt interface passivation, and results show T80 extends to 1200h, providing reference for industrialization." → Objective="To address thermal degradation"; Methods="we adopt interface passivation"; Results="results show T80 extends to 1200h"; Conclusion="providing reference for industrialization". Do NOT assign a multi-functional sentence to a single move.

  Judge by language mechanism, not isolated vocabulary. Attend to:

  1. Research actor: distinguish "this paper/we/our" from "previous studies/existing research/prior work". A finding sentence with a third-party actor (e.g., "Previous studies have shown...") is Background,
  not this paper''s Result, even if it contains "shown".

  2. Fact status / tense: distinguish completed ("showed/demonstrated/found/improved") from planned ("will/plan to") and expected ("is expected to/can potentially"). "can improve" is likely method-function,
  not a result.

  3. Method function vs real result: a sentence merely describing what a method can do or is expected to do is NOT a result; require experimental/numeric/comparison evidence to label as Results.

  4. Results vs Conclusion boundary: Results state objective facts; Conclusion interprets them, gives implications or suggestions. Conclusion usually follows Results; if a suggestion appears before Results,
  it is Objective.

  5. Objective vs Methods boundary: "We propose/introduce/present [NAME]" as the first declaration → Objective; method details that follow → Methods. For "To address/enhance <goal>, we employ/adopt/apply
  <technique>" patterns, split at the comma: the "To <goal>" clause → Objective (the pain point to solve), the "we <action> <technique>" clause → Methods. The inverted variant splits the same
  way (2026-11-07 user-reported case): "This study addresses/investigates/examines <the problem of X> by employing/using/adopting <Y>" → Objective = "This study addresses <X>" (the problem
  addressed), Methods = "by employing <Y>..." — split at the "by V-ing" boundary; never put the whole sentence into Methods leaving Objective empty. Do NOT assign such a multi-functional
  sentence to a single move.


  6. Paradigm-description sentences (how the existing approach/paradigm works, e.g. "Based on these sequences, GR predicts the next item by ...") describe prior-art mechanics, not this paper''s method —
  label them Background, not Methods.

  7. Discourse order: typically Background→Objective→Methods→Results→Conclusion; position is only auxiliary evidence.

  8. Non-move declarations: availability statements (code/model/dataset released or available, with or without a URL),
  acknowledgements, and contact info do NOT belong to any of the five moves — never force them into Conclusion. Exclude
  them from every span.

  9. Output must be verbatim excerpts; the five spans reconstruct the abstract minus excluded non-move declarations.

  10. Thesis vs Results (2026-11-06): an early central claim of what this paper shows/highlights/demonstrates
  ("In this paper, we highlight a fundamental distinction...", "we show that X causes Y") is the paper''s thesis
  → Objective, NOT Results. Results require experimental evidence (datasets, benchmarks, numbers, comparisons)
  or explicit evaluation verbs ("experiments show", "we evaluate", "achieves X% on Y"). Conversely, an outcome
  claim embedded at the end of a method sentence ("..., leading to consistent improvements in zero-shot
  performance") is a Results fragment — split it at the comma/gerund boundary into Results, do not leave it
  inside Methods.'
system_prompt: 'You are an expert in rhetorical move recognition for English scientific abstracts. Extract five move semantic fragments from the input abstract.

  CORE RULE — Sub-sentence semantic fragments: a long sentence often serves multiple move functions and MUST be split at semantic boundaries (commas, semicolons, periods). Incomplete sentences are allowed, but each fragment must have a clear, independent move function.

  Example input: "Perovskite solar cells offer high conversion efficiency. To address thermal degradation of perovskite films, we adopt an interface passivation strategy introducing organic ligands to suppress ion migration, and test results show that device T80 lifetime extends to 1200h at 85°C, providing reference for industrialization."

  Correct output: Background="Perovskite solar cells offer high conversion efficiency"; Objective="To address thermal degradation of perovskite films"; Methods="we adopt an interface passivation strategy introducing organic ligands to suppress ion migration"; Results="test results show that device T80 lifetime extends to 1200h at 85°C"; Conclusion="providing reference for industrialization".

  Each move text must be a verbatim excerpt of the original text (no rewriting, no addition). If a move is absent from the abstract, output an empty string.

  Five move categories:

  - Background: context, problem origin, real-world need, gaps in prior work;

  - Objective: what this paper aims to solve or achieve;

  - Methods: data, models, methods, experimental setup, framework construction;

  - Results: objective findings, data outcomes, experimental facts;

  - Conclusion: interpretation of results, implications, suggestions, significance.

  Classification rules (STRICTLY follow):

  - Sub-sentence semantic fragment splitting (core principle): a long sentence often serves multiple move functions and MUST be split at semantic boundaries — at commas, semicolons, or periods. Incomplete sentences are allowed, but each fragment must have a clear, independent move function. Do NOT assign an entire multi-functional sentence to a single move leaving others empty.

  Example: "To address the thermal degradation of perovskite films, we adopt an interface passivation strategy introducing organic ligands to suppress ion migration, and test results show that device T80 lifetime extends to 1200h at 85°C, providing reference for perovskite photovoltaic industrialization." should be split into:
    Objective = "To address the thermal degradation of perovskite films"
    Methods = "we adopt an interface passivation strategy introducing organic ligands to suppress ion migration"
    Results = "test results show that device T80 lifetime extends to 1200h at 85°C"
    Conclusion = "providing reference for perovskite photovoltaic industrialization"

  - "We propose / We introduce / We present [NAME]" as a declaration sentence (announcing what this paper does) → Objective; subsequent method details (how it works, technical specifics) → Methods. Do NOT
  merge the declaration into Methods.

  - "Results show / Experiments demonstrate" with specific data (numbers, comparisons, percentages) → Results; only the final summarizing/uplifting clause → Conclusion. Do NOT classify an entire sentence
  containing data as Conclusion.

  If the abstract contains no sentence for a move, output an empty string for that move.'
