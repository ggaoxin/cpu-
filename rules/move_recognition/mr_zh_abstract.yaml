examples:
- abstract: '进行亚跨声速风洞试验时，模型迎角快速变化导致马赫数剧烈振荡，传统PID控制策略难以使马赫数快速稳定。基于长短时记忆神经网络（LSTM），提出一种适用于某暂冲式风洞的马赫数建模与智能控制一体化方法。建模方法使用同一试验模型的历史试验数据对LSTM网络进行训练，建模精度达R2>0.98。基于LSTM模型，提出小扰动最优化智能控制方法，该方法在每个时间步对阀门开度进行局部扰动寻优。结果表明：在理想情况下，目标马赫数1.2、0.95、0.8时马赫数均方根误差分别降低76%、82%、51%；即使在引入LSTM模型预测误差后，RMS仍分别降低61%、56%、42%，系统抗扰动能力得到显著提升。

    '
  spans:
    研究方法: 基于长短时记忆神经网络（LSTM），提出一种适用于某暂冲式风洞的马赫数建模与智能控制一体化方法。建模方法使用同一试验模型的历史试验数据对LSTM网络进行训练，建模精度达R2>0.98。基于LSTM模型，提出小扰动最优化智能控制方法，该方法在每个时间步对阀门开度进行局部扰动寻优。
    研究目的: ''
    研究结果: ''
    研究结论: 结果表明：在理想情况下，目标马赫数1.2、0.95、0.8时马赫数均方根误差分别降低76%、82%、51%；即使在引入LSTM模型预测误差后，RMS仍分别降低61%、56%、42%，系统抗扰动能力得到显著提升。
    研究背景: 进行亚跨声速风洞试验时，模型迎角快速变化导致马赫数剧烈振荡，传统PID控制策略难以使马赫数快速稳定。
- abstract: '高校体育场馆管理正由经验管理向数据驱动的智慧治理转变，但仍面临数据孤岛与决策滞后等现实困境。本研究探究大数据赋能高校体育场馆智慧化建设的作用机理、现实困境与实现路径。采用文献资料法和逻辑分析法，围绕数据治理与运营协同开展归纳分析。研究发现，数据要素汇聚能够重塑管理决策并优化资源配置，但数据治理体系与协同机制仍需完善。由此提出应构建数据治理体系并创新运营管理机制，以促进高校体育场馆可持续发展。

    '
  spans:
    研究方法: 采用文献资料法和逻辑分析法，围绕数据治理与运营协同开展归纳分析。
    研究目的: 本研究探究大数据赋能高校体育场馆智慧化建设的作用机理、现实困境与实现路径。
    研究结果: 研究发现，数据要素汇聚能够重塑管理决策并优化资源配置，但数据治理体系与协同机制仍需完善。
    研究结论: 由此提出应构建数据治理体系并创新运营管理机制，以促进高校体育场馆可持续发展。
    研究背景: 高校体育场馆管理正由经验管理向数据驱动的智慧治理转变，但仍面临数据孤岛与决策滞后等现实困境。
functional_item: 语步识别工具
input_type: text
name: 中文摘要语步识别
output_schema:
  properties:
    研究方法:
      type: string
    研究目的:
      type: string
    研究结果:
      type: string
    研究结论:
      type: string
    研究背景:
      type: string
  required:
  - 研究背景
  - 研究目的
  - 研究方法
  - 研究结果
  - 研究结论
  type: object
pattern_rules:
- action: +score
  description: 总结性意义尾句（"……能力得到显著提升""性能得到明显改善"）是总体性评价，判研究结论；纯数据陈述子句不受影响（分号复合句常被分句器切开，总结尾句独立成句时仍须触发）
  exclusion_conditions:
  - any_of:
    - 已有研究
    - 相关文献
    - 其他学者
    kind: keyword
  - any_of:
    - 能够提高
    - 可以增强
    - 有望
    - 预期
    kind: keyword
  id: MR-ZH-111
  layer: universal
  level: strong
  necessary_conditions:
  - any_of:
    - 显著提升
    - 明显改善
    - 大幅提升
    - 大幅提高
    - 显著增强
    - 能力得到
    kind: keyword
  - kind: regex
    pattern: (能力|性能|效果|精度|鲁棒性|抗扰|泛化)(能力)?(得到|获得)?(显著|明显|大幅|有效)?(提升|改善|提高|增强)
