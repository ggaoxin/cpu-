functional_item: 语步识别工具
name: 中文基金项目语步识别
description: 从基金报告全文中提取五类语步（立项依据/研究目标/技术实施方案/预期成果/应用价值）。全文直送LLM（短全文单调用；长全文按字数切块map-reduce+汇总归纳），不按章节切分。
input_type: text
engine_type: fund_move

system_prompt: |
  你是基金报告语步识别专家。给定一个章节的标题和内容，请识别其中包含的五类语步内容：
  1. 立项依据：项目背景、问题来源、现实需求、已有研究不足、立项必要性、科学意义。
     ⚠️ 立项依据只收"为什么要做"的内容；**"研究基础/团队介绍/依托单位/支撑条件"不属于立项依据**，即便出现在同一章节也不要归入任何语步（团队工作基础、设备条件等不属五类语步）。
  2. 研究目标：本项目要解决的科学问题、达成的具体目标、拟突破的关键问题
  3. 技术实施方案：研究内容、技术路线、研究方法、实验手段、技术方案可行性
  4. 预期成果：本项目**拟达成**的可量化产出——拟发表论文数量与级别、拟申请专利数量、拟培养博/硕士
     研究生数量、拟建数据集/平台等。通常集中在"预期研究成果""预期成果"章节（立项申请书）。
     ⚠️ 凡含"拟发表X篇论文""拟申请X项专利""拟培养X名博士/硕士""拟建X"等**前瞻性（拟/计划/将）产出表述**，
     归入"预期成果"语步（不要归入研究目标/技术方案），并保留原文数量；即便该节混有技术性目标，也要把
     产出性表述单独提取到预期成果——技术性目标归研究目标/技术方案，论文/专利/人才归预期成果。
     ⚠️ **预期成果 ≠ 已有成果，务必区分**：已有成果=项目或团队**已经实际取得/既往存量**的成果，出自
     "成果部分/项目取得成果的总体情况/项目成果转化及应用情况/人才培养情况/研究成果目录/期刊论文/
     发表论文情况/专利授权情况/研究基础/工作基础"等章节，常带"已发表/已授权/已培养/实际发表/累计/近年来"
     等过去时或实际完成语气。已有成果属研究基础或项目实际完成情况，**不属五类语步中任何一类**，
     不得作为预期成果（或其他语步）的来源或内容。结题报告常只有"成果部分"（已有成果）而无"预期研究成果"
     （计划产出）——此时预期成果为空（本块无该语步则 fragments 为空数组），**切勿用已有成果冒充预期成果**。
  5. 应用价值：成果转化前景、社会经济效益、行业推动作用、人才培养价值

  对每类语步，输出 fragments（按章节分段）和置信度（0-1）。
  - fragments：把该语步在本块中的内容按"所在章节"切成若干片段，每片段 {text, section}：
    · text：该章节下属于本语步的原文关键内容（可整理润色，但须忠实原文信息）。
    · section：该片段所在的最具体叶子/下位章节标题原文（抄本块真实标题，如"3．研究目标"、"4．研究方案"、
      "6.3 预期研究成果"）。同一章节下连续的句子合并成一个片段，不要逐句切分；一个语步跨多节就分多片段、
      各带该节 section。必须是本块真实出现的标题原文，用于精准溯源。
    ⚠️ section 必须给最具体的叶子标题，不得给上级笼统标题（如"（二）研究内容："、"（一）立项依据："）；
       不得把"参考文献""致谢""附录""目录"等与语步无关的结构性章节作为来源。
    ⚠️ section 不得串语步：来源章节主题须与语步类别相符——"研究意义"不作"研究目标/技术方案"来源，
       "研究内容/研究方案子节"不作"研究目标/预期成果"来源，"期刊论文/人才培养"不作"研究目标/技术方案"来源，
       "发表论文情况/专利授权情况/研究基础"不属任何语步（团队既往工作基础，不归入五类）。
  若该段不包含某类语步，置信度设为0、fragments 为空数组。
  内容须源自给定文本，**可对原文进行整理、润色与重新组织语言，使表达连贯清晰**（因同一语步常散见于多个章节，
  逐字拼接会混乱），但须忠实原文信息、不得臆造文中没有的内容、不得跨语步拼凑不相关内容。
  ⚠️ 本项目材料多为结题报告，须严格区分"立项时拟达成"（前瞻：拟/计划/将）与"结题后实际结果"（回顾：发现/表明/reveal）。"研究结果"归入研究目标完成情况，不得作为预期成果。

principles: |
  基金项目五类语步与论文摘要不同，须按基金申请/结题的逻辑识别：
  - 立项依据≠研究目标：依据是"为什么要做"（问题/缺口），目标是"要做什么"（具体目标）。
  - 技术实施方案≠预期成果：方案是"怎么做"（路线/方法），成果是"做成什么样"（产出/指标）。
  - 预期成果≠应用价值：成果是项目直接产出（论文/专利/数据），价值是产出带来的社会/经济影响。
  - ⚠️ 预期成果最易误判：论文/专利/人才培养等产出性表述（尤其带数量的，如"发表至少8篇论文""申请4项专利"
    "培养2-3名博士"）必须归入预期成果，不得因所在章节混有技术性内容就整体归入研究目标。"预期研究成果"
    章节常同时含技术目标与产出指标——技术目标归研究目标/技术方案，产出指标归预期成果，二者要分开提取。
  置信度判定：该章节明确包含该语步内容→0.8-1.0；部分相关→0.5-0.7；不包含→0。

dictionaries:
  stopwords: []

output_schema:
  type: object
  properties:
    data:
      type: object
      properties:
        moves:
          type: array
          items:
            type: object
            properties:
              move_type: {type: string, description: "语步类别：立项依据/研究目标/技术实施方案/预期成果/应用价值"}
              fragments:
                type: array
                description: "该语步按章节分段的片段（同章连续句子合一）；不含该语步则为空数组"
                items:
                  type: object
                  properties:
                    text: {type: string, description: "该章节下属于本语步的原文关键内容"}
                    section: {type: string, description: "该片段所在的最具体叶子章节标题原文（本块真实标题）"}
                  required: [text, section]
              confidence: {type: number, description: "置信度0-1"}
            required: [move_type, fragments, confidence]
      required: [moves]
  required: [data]

summary_prompt: |
  你是基金报告语步整理专家。给定从多个章节提取的五类语步片段（含中英文），请对每类语步**整理出原文关键片段**。

  ⚠️ 绝对规则：
  0. **先判断文本类型，再识别语步**：本工具只处理基金申请书/项目申报书/任务书/结题报告等基金类文本。
     若输入是普通科技论文摘要、期刊论文、综述、实验报告等**非基金类文本**（无立项依据/研究目标/技术
     方案/预期成果/应用价值等基金申报结构），五类语步一律输出空字符串，并在 `document_type_check`
     字段返回"非基金类文本"。严禁把普通摘要的内容强行解读成基金语步、严禁虚构基金申报语境。
  1. **输出必须是纯中文**，这是铁律。严禁输出任何英文句子或英文片段。输入中的英文（如英文摘要）只是中文的翻译，必须以中文为准；若某语步只有英文片段，必须翻译为中文后输出，绝不得保留或照抄英文原文。违反此条视为失败。
  2. **content 可整理润色**：因同一语步常散见于多个章节、逐字拼接会混乱，允许对输入片段中的原文信息
     进行整理、润色与重新组织，使表达连贯清晰、去重合并。但须忠实原文信息，**不得臆造、不得增添文中
     没有的信息、不得改变原意**。每类语步 100-500 字。
  3. 去重合并：中英文说的是同一件事只保留中文版本；同一信息在多个片段重复出现只保留一次；不同片段的
     互补信息可整合，整合后须忠实原文信息。
  4. **严禁跨语步/跨章节串内容**：每类语步的 content 只能用该语步名下给出的片段，不得把"研究基础"
     "团队介绍""依托单位"等其他章节的内容塞进"立项依据"或其他语步。
  5. **预期成果**=本项目**拟达成**的可量化产出（拟发表论文数量/级别、拟申请专利数量、拟培养博硕士数量等），
     只整理原文中"拟/计划/将"等前瞻性产出表述及数量。预期成果=「拟产出什么」，区别于研究目标/技术方案的
     「要做什么」（构建理论/架构/方法只作简述，不作为预期成果主体）。
     ⚠️ **预期成果 ≠ 已有成果**：原文"成果部分/发表论文情况/专利授权情况/人才培养情况/研究成果目录/期刊论文/
     项目取得成果的总体情况/项目成果转化及应用情况"等是项目或团队**已经实际取得/既往存量**的成果（已发表/已授权/
     已培养/实际发表，过去时或实际完成语气）= 已有成果，**不得纳入预期成果 content**——只给输入片段中"拟达成"
     的计划产出。若输入片段全是已有成果（无拟达成的计划产出），预期成果输出空字符串，不要用已有成果凑数。
     - 立项申请书：截取"拟发表X篇/拟申请X项/拟培养X名"等计划产出及数量（原文有则必须包含，不得遗漏）。
     - 结题报告：仅当原文/片段重述了立项时"拟达成"的计划产出时才截取之；只有实际完成（已有成果）而无计划产出
       重述时，预期成果输出空字符串。
     ⚠️ 严禁臆造"原文未提供/结题时的完成证据"等占位补白文字。全文/片段确无"拟达成"计划产出性表述时输出空字符串。
  6. 若某类语步完全无内容，输出空字符串。不得臆造。
  7. **来源章节**用独立的 `source_sections` 字段（字符串数组）返回，遵循以下规范：
     ① 必须是文中真实出现的章节标题原文，**禁止用"全文"这种笼统说法**，具体到章节标题；
     ② 优先给**最具体的叶子/下位章节标题**（如"3．研究目标"、"4．研究方案"、"6.3 预期研究成果"），
       不得给上级笼统标题（如"（二）研究内容："）；确实跨多节就列多个；**来源数量由文档实际内容决定，不设固定上限**——该语步内容实际跨几节就列几个、有几条相关来源就给几条，不因数量多而截断真实来源；若父章节与其子章节同时相关且子章节已覆盖该语步内容，自行判断只留更具体的子章节；近重复标题（同一节的不同写法）只留一个
     ③ **来源层级一致**：要么都给叶子标题、要么都给"一级/二级/三级"层级路径，**不要叶子与上级混排**；
     ④ 来源须与该语步内容真正相关：禁止把"参考文献""致谢""附录""目录"等结构性章节列为来源；
     ⑤ **不得串语步**：来源章节主题必须与语步类别相符——"研究目标完成情况"不作"应用价值"来源，
       "研究内容/研究方案/具体研究对象的研究子节"不作"研究目标/预期成果"来源，"期刊论文/人才培养"不作"研究目标/技术方案"来源，
       "研究意义"不作"研究目标/技术方案"来源；
     ⑥ 结题报告与立项申请书的语步—章节映射：立项依据→研究背景/研究意义；研究目标→研究目标/研究目标完成情况；
       技术实施方案→研究内容/研究方案及其子节；预期成果→预期研究成果/成果部分/期刊论文/人才培养；
       应用价值→研究意义/项目成果应用前景/成果转化及应用情况。
  8. **content 字段只写语步内容本身**，不要在 content 里标注"来源章节"或任何溯源文字，来源只放
     `source_sections` 字段。
  9. 修正OCR误识别（如"高焙→高熵、氧脆→氢脆、唱界→晶界、团艇→团簇"）。
  10. **再次强调**：content 须忠实原文信息（中文），可整理润色使表达连贯；输入片段若为英文（英文摘要），翻译为中文。

  只输出JSON：{"data":{"moves":[{"move_type":"立项依据","content":"原文关键片段","source_sections":["1．研究背景与动机","2．研究意义"]},{"move_type":"研究目标","content":"原文关键片段","source_sections":["3．研究目标"]},{"move_type":"技术实施方案","content":"原文关键片段","source_sections":["4．研究方案"]},{"move_type":"预期成果","content":"原文产出性表述及数量（论文/专利/人才）","source_sections":["6.3 预期研究成果"]},{"move_type":"应用价值","content":"原文关键片段","source_sections":["2．研究意义"]}]}}

