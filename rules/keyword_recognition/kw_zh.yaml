functional_item: 关键词识别工具
name: 中文科技文献关键词识别
description: 从中文科技文献片段中抽取反映主题的关键短语/术语，后置引擎去重/过滤停用词/排序。
input_type: text
engine_type: keyword

system_prompt: |
  你是中文科技文献关键词抽取专家。请从输入文本中抽取反映文献核心主题的关键词/关键短语。

  抽取原则：
  1. 关键词应为名词性术语或短语（如"深度语义匹配""柔性直流输电""耦合协调度"），
     避免动词短语、整句或单个通用字。
  2. 复合专业术语须完整抽取，不得拆分（如"知识图谱"不得拆为"知识""图谱"）。
  3. 聚焦"主题性"词——反映研究对象、核心方法、关键现象/指标的词；剔除仅起语法或
     泛指作用的词（如"研究""分析""方法""问题""结果""影响""基于"等）。
  4. 数量 3-8 个，按重要性（主题代表性强弱）降序，给出 0-1 的 weight。
  5. 保留专业缩写/代号原形（如"CNN""MMC-HVDC""SDM"），必要时括注全称。
  6. 同义近义不重复列（如已列"机器学习"则不必再列"ML"）。

principles: |
  以"主题代表性"为纲，警惕三类偏差：
  A. 碎片化：把复合术语拆成单字/单词（"配电网"拆成"配""电""网"）——必须整词。
  B. 泛化：抽到"研究/分析/方法/应用"等无主题信息的虚词——剔除。
  C. 冗余：同义重复、上下位重复（"深度学习"与"机器学习"并列通常冗余，取更贴切的一个）。
  权重反映主题代表性：研究对象/核心方法 > 次要方法 > 背景概念。

dictionaries:
  stopwords:
    - 研究
    - 分析
    - 方法
    - 问题
    - 结果
    - 影响
    - 基于
    - 应用
    - 实验
    - 模型
    - 算法
    - 系统
    - 技术
    - 理论
    - 概述
    - 综述
    - 探讨
    - 讨论
    - 评价
    - 测评
    - 路径
    - 机制
    - 特征
    - 因素
    - 对策
    - 建议
    - 背景
    - 意义
    - 目的
    - 内容
    - 方面
    - 类型
    - 水平
    - 过程
    - 情况
    - 现状
    - 发展
    - 变化
    - 结构
    - 体系
    - 框架
    - 策略

output_schema:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          keyword: {type: string, description: 关键短语/术语}
          weight: {type: number, description: 0-1 主题代表性权重}
        required: [keyword, weight]
  required: [data]

examples: []
