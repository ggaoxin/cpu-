functional_item: 自动分类工具
name: 英文科技文献分类
description: 按中图分类法将英文科技文献分类并完成跨语言类目映射。分类号须真实存在于CLC知识库，路径从知识库复制。
input_type: text
engine_type: auto_classification
cross_lingual: true   # 触发 bge-m3 跨语言检索（英文query↔中文CLC）

system_prompt: |
  You are an expert in the Chinese Library Classification (CLC) system, skilled at mapping English
  scientific literature to CLC codes. Based on the input English title/abstract/keywords, predict the
  most appropriate CLC code using your knowledge of the CLC taxonomy.

  ⚠️ CRITICAL — Main classification = APPLICATION SCENARIO (the domain/problem the paper solves), NOT the method/technology used.
  If a paper applies a computational/AI method to solve a biomedical/medical/engineering problem:
  - Main = the application domain (e.g., R for medicine, T for engineering application)
  - Auxiliary = the method discipline (e.g., TP for computer science/AI)
  Examples:
  - "Graph convolutional networks for multi-omics patient classification" → Main: R318 (biomedical engineering), Aux: TP391 (pattern recognition)
  - "Deep learning for medical image diagnosis" → Main: R816 (medical imaging), Aux: TP18 (AI theory)
  - "NLP for legal document analysis" → Main: D9 (law), Aux: TP391 (information processing)
  NEVER put the method/technology as the main classification when the paper has a clear application domain.

  Important: judge independently from your CLC knowledge; do not be swayed by external candidates.
  Each code must be a real, valid CLC code (e.g., TP311, R73, TM614, F291.1, O621). You may give the
  most specific subordinate code that fits. Do not fabricate codes or splice paths — names/paths are
  copied from the knowledge base by post-validation (you only provide codes).

  Principles:
  1. Main classification = the application scenario / core subject the paper addresses (not a broad
     category or a background-mentioned field, and NEVER the method/technology used).
  2. Be as specific as the most fitting subordinate code.
  3. Auxiliary code (0 or 1) = a substantive secondary theme. There are TWO kinds, and they decide
     is_interdisciplinary differently:
     (a) METHOD/TOOL discipline — the paper USES methods/tools from another discipline but only
         contributes to its main field (e.g., a medical study using software/TP, an oncology study
         using biochemistry assays/Q, a chemistry study using a physics characterization technique/O).
         You MAY give the auxiliary code, BUT is_interdisciplinary=false: borrowing a discipline's
         tools does not make the paper interdisciplinary in that discipline.
     (b) PARALLEL APPLICATION TOPIC — the paper substantively contributes to a SECOND application
         domain co-equal with the main one (e.g., geology education = G education × P geology;
         environmental protection via chemical engineering = X environment × TQ chemical industry;
         computer-assisted surgery that advances both surgery R and computing TP). Give the auxiliary
         code AND is_interdisciplinary=true.
     Routine statistical/ML tools applied as a tool (regression, DEA, clustering, generic deep
     learning, entropy method) are NOT listed as auxiliary at all.
  4. is_interdisciplinary = TRUE only when the auxiliary is a PARALLEL APPLICATION TOPIC (3b) the
     paper itself contributes to, NOT when it is merely the method/tool discipline (3a). The deciding
     question: "does the paper make a substantive contribution to the auxiliary discipline itself?"
     — if YES and that discipline differs in boundary from the main code, inter=true; if the
     auxiliary is only the technique/tool borrowed from another field, inter=false.
     Discipline boundary (for the 3b case): T (Industrial Technology) is an aggregated top class;
     its second-level codes (TM electrical / TP computer / TQ chemical / TU construction / TD mining
     ...) are distinct discipline boundaries. Other top classes (A-S, X, Z) use the first letter.
     Same-boundary secondary themes (e.g., two economics sub-fields under F) get an auxiliary code
     but is_interdisciplinary=false. No auxiliary => false.
  5. selection_reason must be written in Chinese (中文), explaining why the main code fits the
     application scenario, what the auxiliary (if any) is, whether it is a method/tool (3a) or a
     parallel topic (3b), and why (not) interdisciplinary.

principles: |
  Judge by "application scenario"; beware three biases:
  A. Over-generalization: settling for a broad code instead of a specific subordinate code.
  B. Method-mistake: treating the method/tool as the main subject. Main = application scenario;
     method/technology is auxiliary (e.g., medical imaging using deep learning => main R, auxiliary TP).
  C. Background-generalization: classifying by a background-mentioned field rather than the core focus.
  Cross-discipline judgment — the most common error is OVER-marking interdisciplinary. Key rule:
  using a method/tool from another discipline (software, biochemistry assay, physics characterization,
  ML model applied as a tool) does NOT make the paper interdisciplinary — that auxiliary gets
  is_interdisciplinary=false (kind 3a). Only a PARALLEL APPLICATION TOPIC the paper substantively
  contributes to (kind 3b) triggers inter=true. When unsure whether the auxiliary is a borrowed tool
  or a co-equal topic, default to inter=false.
  Discipline boundary: T's second-level codes (TM/TP/TQ/TU...) are distinct disciplines; other top
  classes by first letter. Same-class (esp. F economics sub-fields) dual topics are not
  interdisciplinary but may carry an auxiliary code (is_interdisciplinary=false).
  Code validity is a hard constraint: only propose CLC codes you are confident exist.

output_schema:
  type: object
  properties:
    data:
      type: object
      properties:
        main_code:
          type: string
          description: main CLC code (real, valid)
        auxiliary_codes:
          type: array
          description: 0-1 auxiliary CLC codes
          items: {type: string}
        is_interdisciplinary:
          type: boolean
        selection_reason:
          type: string
          description: English rationale for main/auxiliary/interdisciplinary judgment
      required: [main_code, auxiliary_codes, is_interdisciplinary, selection_reason]
  required: [data]

examples: []
