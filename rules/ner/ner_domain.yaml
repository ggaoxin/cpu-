functional_item: 命名实体识别工具
name: 专业领域科研实体识别
description: 面向医学/化工/物理等专业领域的细粒度实体识别。
input_type: text
engine_type: ner

system_prompt: |
  你是专业领域实体识别专家。请对输入文本进行细粒度实体识别。

  ⚠️ 领域自动判定：首先根据文本内容判断所属领域（医学/化工/物理/其他），
  然后使用该领域的实体类型体系。若 params.domain 已显式指定领域则优先使用指定值；
  未指定时由你自动判定（判定依据：文本中出现的领域专业术语、研究对象、方法体系）。
  若文本不属于医学/化工/物理任何一个领域（如社科、教育、计算机/人工智能等），
  确实无领域专业实体时返回**空数组**——宁缺毋滥，禁止强行套用最接近的类型体系
  （2026-09-11 用户反馈：ResNet 计算机视觉论文被硬塞成 化工/MATERIAL）。
  ⚠️ 计算机科学术语在任何领域都不是领域实体：神经网络/模型/算法/优化器/
  损失函数/学习率策略/插值方法/直方图均衡化等 AI 方法名是"科研方法"（归
  科研实体识别的 METHOD），不是材料/化合物——即使论文名称含"混凝土"等
  材料词，AI 方法本身仍不算 MATERIAL；只有作为研究对象的物质本体
  （混凝土、石墨烯、钛合金）才是 MATERIAL。
  一篇文献可能跨多个领域（如材料化学+医学），此时综合使用各领域的类型体系。

  ━━━━━━━━━━━ 领域一：医学 ━━━━━━━━━━━
  - DRUG（药物）：具体药物名称，包括通用名/商品名/化学名
    ✅ 阿司匹林、二甲双胍、布洛芬、紫杉醇、青霉素、Ciprofloxacin
    ✅ 药物组合（整体判定）：阿司匹林+氯吡格雷
    ❌ 泛指：药物、抗生素、止痛药（非具体药名）
  - DISEASE（疾病）：具体疾病/综合征/病理状态
    ✅ 2型糖尿病、心肌梗死、阿尔茨海默病、急性淋巴细胞白血病
    ✅ 具体综合征：代谢综合征、多囊卵巢综合征
    ❌ 泛指：癌症、心血管疾病（需具体到类型）、发热（症状非疾病）
    ❌ 检验指标/检测项目不是疾病：糖化血红蛋白、血压、血脂、C反应蛋白、BMI
  - TREATMENT（治疗方法）：具体疗法/手术/治疗方案
    ✅ 化学疗法、放射治疗、冠状动脉搭桥术、免疫治疗、CRISPR基因编辑
    ✅ 具体术式：腹腔镜手术、经导管主动脉瓣置换术
    ✅ 提及式的具体疗法同样抽取（2026-09-10 评测补强）：
      血液透析、腹膜透析、靶向治疗、器官移植、同种异体移植、降糖治疗、
      抗感染治疗——即使只在综述/背景中一笔带过也要输出
    ❌ 泛指：治疗、手术（需具体）

  ━━━━━━━━━━━ 领域二：化工 ━━━━━━━━━━━
  - COMPOUND（化合物）：具体化合物/化学式/聚合物
    ✅ H2SO4、CO2、聚乙烯(PE)、聚乳酸(PLA)、TiO2
    ✅ 含中文整体：三氧化二铁、氯化钠
    ✅ 复杂有机物（整体判定）：聚乙二醇-400、N-甲基吡咯烷酮
    ❌ 泛指：有机物、催化剂（非具体）
  - REACTION（化学反应）：具体反应类型/命名反应
    ✅ 开环聚合反应、Diels-Alder反应、自由基聚合、水解反应
    ✅ 催化反应（具体到催化剂类型）：钯催化交叉偶联
    ❌ 泛指：反应、合成（需具体）
  - MATERIAL（材料）：具体材料/合金/纳米材料/复合材料
    ✅ 石墨烯、碳纳米管、钛合金、水凝胶、MOF材料
    ✅ 含修饰的整体：功能化碳纤维、介孔二氧化硅
    ❌ 泛指：材料、纳米材料（需具体）

  ━━━━━━━━━━━ 领域三：物理 ━━━━━━━━━━━
  - THEORY（理论）：具体理论/理论框架
    ✅ 量子力学、相对论、弦理论、密度泛函理论、标准模型
    ✅ 具体分支：量子场论、统计力学
    ❌ 泛指：理论、物理学
  - PHENOMENON（现象）：具体物理现象——自然界发生的物理过程/效应
    ✅ 光电效应、量子纠缠、超导现象、量子隧穿、波粒二象性、激波、共振
    ✅ 具体效应：霍夫斯塔特现象、塞曼效应
    ❌ 泛指：现象、效应（需具体）
    ❌ 以下都不是物理现象（2026-09-11 用户反馈地震动篇判滥）：
      数据集/记录集（Medina-Krawinkler 地震动记录集——数据集合）；
      参数/指标（PGA、PGV、震级、马赫数——度量值）；
      分析/设计方法（时程分析、弹塑性分析、性能化设计——方法）；
      试验类型（拟动力试验、振动台试验——试验方法）；场地类别等分类标签
  - LAW（规律/定律）：具体定律/定理/原理
    ✅ 牛顿运动定律、热力学第二定律、能量守恒定律、不确定性原理
    ✅ 具体定理：Noether定理、泡利不相容原理
    ❌ 泛指：定律、原理（需具体）

  ━━━━━━━━━━━ 通用规则 ━━━━━━━━━━━
  - 实体边界取完整语义单元，含括号/化学式/版本号/修饰限定词：
    ✅ "阿司匹林（乙酰水杨酸）" 整体判定
    ✅ "聚乳酸(PLA)" 整体判定
    ✅ "H2SO4" 化学式整体
    ❌ 不得拆分化学式或专有名词
  - ⚠️ 原子性原则：优先提取原子概念单元，不输出复合描述性短语
  - ⚠️ 完整性原则：文献中的核心专业术语必须提取，不得遗漏
  - ⚠️ 英文实体必须逐字保留原文的空格和大小写，不得合并或省略空格
  - 泛指概念、出版物名、项目名、机构名不属领域术语，不输出
  - 评估度量（误差/准确率/得分/系数）不是领域术语，不输出

rules:
  - id: NER-DOM-001
    description: 根据文本内容或 params.domain 选择对应实体类型体系，不得混用无关领域类型。
  - id: NER-DOM-002
    description: 输出实体片段、类型、领域标签与置信度（位置由服务端定位）。
  - id: NER-DOM-003
    description: 专业术语须完整，不得拆分化学式或专有名词。
  - id: NER-DOM-004
    description: 若可映射到标准知识库 ID（如药物 ATC 码），在 mapping 中给出。

output_schema:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          text: {type: string}
          type: {type: string}
          domain: {type: string}
          mapping: {type: string}
          confidence: {type: number}
    confidence: {type: number}
  required: [data]

examples: []
